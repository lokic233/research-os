<!doctype html><html><head><meta charset=utf-8><title>research-os ops dashboard</title>
<style>
body{font-family:ui-sans-serif,system-ui,Arial;margin:0;background:#0b0e14;color:#e6edf3}
h1{font-size:17px;padding:13px 18px;margin:0;border-bottom:1px solid #1f2530;background:#11151d}
h2{font-size:13px;color:#8b949e;margin:18px 16px 6px;text-transform:uppercase;letter-spacing:.5px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px}
.kpi{background:#11151d;border:1px solid #1f2530;border-radius:10px;padding:9px 13px;min-width:104px}
.kpi b{font-size:21px;display:block}.kpi span{color:#8b949e;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:8px 16px}
.card{background:#11151d;border:1px solid #1f2530;border-radius:10px;padding:12px}
.ct{font-size:12px;color:#8b949e;margin:0 0 8px;font-weight:600}
.warn{color:#f0883e}.bad{color:#f85149}.ok{color:#3fb950}
#bn div{padding:5px 0;border-bottom:1px solid #1f2530;font-size:13px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#8b949e;margin-top:6px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:flex-end}
.bcol .stack{width:60%;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden}
.bcol .seg{width:100%}.bcol small{font-size:10px;color:#8b949e}
.bval{font-size:11px;color:#e6edf3;font-weight:600}
small{color:#8b949e}
</style></head><body>
<h1>research-os — operational dashboard <small id=ts></small></h1>
<div class=kpis id=kpis></div>
<h2>Instance (shared committee + GPU)</h2>
<div class=grid id=ig></div>
<h2>Per-project (latest snapshot)</h2>
<div class=grid id=pg></div>
<div class=card style="margin:0 16px 16px"><b>Bottleneck signals</b><div id=bn></div></div>
<script>
var D=__DATA__;
var I=D.instance||[], P=D.projects||{};
var last=I.length?I[I.length-1]:{}, prev=I.length>1?I[I.length-2]:{};
var pids=Object.keys(P).sort();
var COL=['#58a6ff','#3fb950','#f0883e','#bc8cff','#f85149','#56d4dd'];
document.getElementById('ts').textContent=last.ts?('· '+last.ts+' · '+I.length+' snapshot'+(I.length>1?'s':'')+' · '+pids.length+' projects'):'(no data)';
function kpi(l,v,c){return '<div class=kpi><b class="'+(c||'')+'">'+v+'</b><span>'+l+'</span></div>';}
var gpuIdle=(last.gpu_leases_active||0)===0;
document.getElementById('kpis').innerHTML=[
 kpi('claims',last.claims||0),kpi('verdicts',last.verdicts||0),kpi('GREEN',last.verdict_green||0,'ok'),
 kpi('cemetery',last.cemetery||0),kpi('experiments',last.experiments_total||0),
 kpi('CPU / GPU exp',(last.cpu_exp||0)+' / '+(last.gpu_exp||0)),
 kpi('committee done',last.committee_done||0,'ok'),
 kpi('committee incomplete',last.committee_incomplete||0,(last.committee_incomplete>0?'bad':'')),
 kpi('GPU leases',last.gpu_leases_active||0,(gpuIdle?'warn':'ok')),
 kpi('GPU queue',last.gpu_queue_len||0)].join('');

// sparkline (SVG polyline); falls back to a single dot for 1 point
function spark(series,color){
 var w=300,h=110,pad=6; var vals=series.map(function(x){return x||0;});
 var mx=Math.max.apply(null,vals.concat([1])), mn=Math.min.apply(null,vals.concat([0]));
 var rng=(mx-mn)||1, n=vals.length;
 function X(i){return n<=1?w/2:pad+i*(w-2*pad)/(n-1);}
 function Y(v){return h-pad-(v-mn)*(h-2*pad)/rng;}
 var pts=vals.map(function(v,i){return X(i)+','+Y(v);}).join(' ');
 var dots=vals.map(function(v,i){return '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="2.5" fill="'+color+'"/>';}).join('');
 var poly=n>1?'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2"/>':'';
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="120" preserveAspectRatio="none">'+poly+dots+'</svg>';
}
function multiCard(title,series){ // series: [{l,c,data:[...]}]
 var body=series.map(function(s){return spark(s.data,s.c);}).join('');
 // overlay all on one svg
 var w=300,h=110,pad=6; var all=[].concat.apply([],series.map(function(s){return s.data;})).map(function(x){return x||0;});
 var mx=Math.max.apply(null,all.concat([1])), mn=Math.min.apply(null,all.concat([0])), rng=(mx-mn)||1;
 var n=Math.max.apply(null,series.map(function(s){return s.data.length;}));
 function X(i){return n<=1?w/2:pad+i*(w-2*pad)/(n-1);}
 function Y(v){return h-pad-(v-mn)*(h-2*pad)/rng;}
 var svg=series.map(function(s){
   var pts=s.data.map(function(v,i){return X(i)+','+Y(v||0);}).join(' ');
   var dots=s.data.map(function(v,i){return '<circle cx="'+X(i)+'" cy="'+Y(v||0)+'" r="2.5" fill="'+s.c+'"/>';}).join('');
   return (s.data.length>1?'<polyline points="'+pts+'" fill="none" stroke="'+s.c+'" stroke-width="2"/>':'')+dots;
 }).join('');
 var leg=series.map(function(s){return '<span><i style="background:'+s.c+'"></i>'+s.l+' ('+(s.data[s.data.length-1]||0)+')</span>';}).join('');
 return '<div class=card><p class=ct>'+title+'</p><svg viewBox="0 0 '+w+' '+h+'" width="100%" height="120" preserveAspectRatio="none">'+svg+'</svg><div class=lg>'+leg+'</div></div>';
}
function col(field){return I.map(function(r){return r[field]||0;});}
document.getElementById('ig').innerHTML=[
 multiCard('Production (claims / verdicts / cemetery)',[{l:'claims',c:COL[0],data:col('claims')},{l:'verdicts',c:COL[1],data:col('verdicts')},{l:'cemetery',c:'#8b949e',data:col('cemetery')}]),
 multiCard('Experiments (CPU / GPU / completed)',[{l:'CPU',c:COL[0],data:col('cpu_exp')},{l:'GPU',c:COL[2],data:col('gpu_exp')},{l:'done',c:COL[1],data:col('exp_completed')}]),
 multiCard('Committee (done / incomplete)',[{l:'done',c:COL[1],data:col('committee_done')},{l:'incomplete',c:COL[4],data:col('committee_incomplete')}]),
 multiCard('GPU (leases / queue / gpu-exp)',[{l:'leases',c:COL[2],data:col('gpu_leases_active')},{l:'queue',c:COL[0],data:col('gpu_queue_len')},{l:'gpu-exp',c:COL[1],data:col('gpu_exp')}])
].join('');

// per-project grouped bars (latest snapshot) — renders fine with 1 snapshot
function pbars(title,field){
 var vals=pids.map(function(p){var s=(P[p]||[]); return (s.length?s[s.length-1][field]:0)||0;});
 var mx=Math.max.apply(null,vals.concat([1]));
 var cols=pids.map(function(p,i){
   var v=vals[i], hpx=Math.round(v/mx*120);
   return '<div class=bcol><span class=bval>'+v+'</span><div class=stack style="height:'+hpx+'px"><div class=seg style="height:100%;background:'+COL[i%COL.length]+'"></div></div><small>'+p.replace('PROJ-','P')+'</small></div>';
 }).join('');
 return '<div class=card><p class=ct>'+title+'</p><div class=bars>'+cols+'</div></div>';
}
document.getElementById('pg').innerHTML=[
 pbars('Claims per project','claims'),
 pbars('Verdicts per project','verdicts'),
 pbars('Experiments per project','experiments_total'),
 pbars('GREEN verdicts per project','verdict_green')
].join('');

var bn=[];
if((last.gpu_leases_active||0)===0&&(last.gpu_queue_len||0)===0
) bn.push(['warn','GPU IDLE: 0 leases + empty queue — H100 capacity unused. Queue a committee-approved serving exp or accept the CPU-bound phase.']);
if((last.committee_incomplete||0)>0) bn.push(['bad','COMMITTEE_INCOMPLETE='+last.committee_incomplete+' — runner dropped members; re-run, never count.']);
if(I.length>1 && (last.claims||0)===(prev.claims||0) && (last.verdicts||0)===(prev.verdicts||0)) bn.push(['warn','STALL: no new claims/verdicts since previous snapshot.']);
var ratio=last.experiments_total?((last.gpu_exp||0)/last.experiments_total*100).toFixed(0):0;
var gr=last.verdicts?((last.verdict_green||0)/last.verdicts*100).toFixed(0):0;
bn.push(['ok','GPU-exp share '+ratio+'% · GREEN rate '+gr+'% ('+(last.verdict_green||0)+'/'+(last.verdicts||0)+'). CPU research is cheap+parallel; reserve GPU for serving cells.']);
var mn=1e9,mx=-1,mnp='',mxp='';
pids.forEach(function(p){var s=(P[p]||[]); var c=(s.length?s[s.length-1].claims:0)||0; if(c<mn){mn=c;mnp=p;} if(c>mx){mx=c;mxp=p;}});
if(pids.length>1 && mx-mn>=4) bn.push(['warn','PROJECT IMBALANCE: '+mxp+' '+mx+' claims vs '+mnp+' '+mn+' — rebalance lanes toward '+mnp+'.']);
document.getElementById('bn').innerHTML=bn.map(function(x){return '<div class="'+x[0]+'">'+x[1]+'</div>';}).join('')||'<div class=ok>no signals</div>';
</script></body></html>
