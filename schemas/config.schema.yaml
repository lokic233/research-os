# Schema: research-os.config.yaml — lives in the INSTANCE repo. The platform-agnostic knobs.
# This is what makes the engine reusable: nodes/backends/budgets are config, never hardcoded.
engine:
  repo: lokic233/research-os
  version: v0
instance:
  name: ""                     # e.g. "lokic233" -> lokic233/autonomous-research
  repo: ""
runtime:
  control_node: ""             # stable node hosting runtime/ (e.g. a laptop) — NOT a GPU node
  runtime_dir: ""              # abs path to runtime/ on the control node
compute_nodes: []              # [{name, kind, gpu_type, gpu_count, host_mem_gb, fragile, probe_cmd}]
                               #   probe_cmd: shell cmd the orchestrator runs to check the node is alive
                               #   (e.g. "ssh <node> nvidia-smi --query-gpu=name --format=csv,noheader")
session_agent_backends: []     # backends researchers can use (e.g. local codex/claude CLI) — config, not code
                               #   (key name kept for back-compat; 'session_agents' are now called 'researchers')
# --- agent embodiment + resource pools ---
agent_embodiment:
  orchestrator: interactive    # new_session, human-in-the-loop, revivable via agent_run.message
  researchers:  interactive    # N parallel unified 'researcher' sessions; each owns a full loop; CPU-only
  committee:    autonomous     # headless CLI, spawn-for-review -> tear down; no human needed
resource_pools:
  cpu_agent_pool:              # orchestrator + researchers + committee CLI calls. NEVER touches GPU.
    budget: {max_concurrent_sessions: 0, max_parallel_researchers: 0, token_aware: true}
  gpu_pool:                    # the actual experiments. ONLY the orchestrator dispatches here.
    dispatch: orchestrator_only   # INVARIANT 3
# --- agent embodiment + resource pools ---
agent_embodiment:
  orchestrator: interactive    # new_session, human-in-the-loop, revivable via agent_run.message
  researchers:  interactive    # N parallel unified 'researcher' sessions; each owns a full loop; CPU-only
  committee:    autonomous     # headless CLI, spawn-for-review -> tear down; no human needed
resource_pools:
  cpu_agent_pool:              # orchestrator + researchers + committee CLI calls. NEVER touches GPU.
    budget: {max_concurrent_sessions: 0, max_parallel_researchers: 0, token_aware: true}
  gpu_pool:                    # the actual experiments. ONLY the orchestrator dispatches here.
    dispatch: orchestrator_only   # INVARIANT 3
committee:                     # logical-standing, physically-on-demand
  rubric_version: v001
  members:                     # role -> backend (backend is config!)
    - {role: novelty_killer,        backend: ""}
    - {role: systems_reviewer,      backend: ""}
    - {role: evaluation_prosecutor, backend: ""}
    - {role: theory_skeptic,        backend: ""}
    - {role: product_realist,       backend: ""}
    - {role: area_chair,            backend: ""}
  green_rule: unanimous        # what counts as GREEN
research:                      # BOOTSTRAP knobs for researcher fan-out + orchestrator self-monitoring
  researchers_per_project: 2   # LIVE researchers each project must always have; floor = this * #active_projects
                               #   (renamed concept: session_agents are now called 'researchers'; they use
                               #    the session_agent_backends config field above)
  self_check_interval_minutes: 10  # orchestrator self-checks researcher heartbeats/health on this cadence
                               #   (now DELEGATED to per-project sub-monitors; orchestrator/monitor are backstops)
  sub_monitor:                 # per-project standby that owns researcher health/floor/debug (decouples it
                               #   from the orchestrator). One sub-monitor per active project.
    enabled: true              # spawn one sub-monitor per project to own researcher health
    one_per_project: true
    monitor_interval_minutes: 5   # sub-monitor checks its project's researchers this often
    retire_at_context_pct: 35  # GLOBAL retire-and-respawn threshold for long-running/standby agents
                               #   (orchestrator, monitor, sub-monitors): graceful handoff at this % context
liveness:
  mode: push                   # agents kick the supervisor; supervisor does not poll-kill
  kick_interval_minutes: 15    # each agent reports alive every ~15m
  patient_grace_minutes: 45    # do NOT declare dead before this (reasoning/long-runs are normal)
budgets:
  level0: {max_wall_clock_minutes: 15, max_gpu_hours: 0.25}
  level1: {max_wall_clock_minutes: 120, max_gpu_hours: 2}
  level2: {requires_orchestrator_approval: true}
  level3: {requires_explicit_human_approval: true}
safety:
  vmm_probe_rule: "cap small; watchdog host RAM AND teardown; use os._exit(); read learning/ first"
