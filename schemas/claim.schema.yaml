# Schema: a research CLAIM (first-class durable object). One file per claim: registry/claims/CLAIM-xxxx.yaml
# Append-only spirit: status/verdict_history grow; never delete, archive instead.
claim_id: CLAIM-0000              # globally unique, zero-padded
project_id: PROJ-0000            # owning project (lifecycle state)
stage: seed                      # PIPELINE position: seed | exploration | candidate | paper-track | archived
status: active                  # VERDICT health: active | weakened | killed | promoted | archived
# --- LIFECYCLE (fine-grained workflow phase; the resume pointer) ---
lifecycle_state: drafted        # the exact phase work is paused at — one of:
                                #   drafted            (claim written, nothing started)
                                #   prior_art_pending  (needs prior-art / cemetery dup check)
                                #   experiment_designing (researcher scoping the probe)
                                #   experiment_running (EXP registered, awaiting result)
                                #   evidence_ready     (experiment(s) complete, not yet reviewed)
                                #   committee_pending  (submitted to committee, awaiting votes)
                                #   verdict_recorded   (verdict written; status reflects it)
                                #   blocked            (needs a human/orchestrator decision)
                                #   done               (terminal: promoted | killed | archived)
next_action: ""                 # RESUME POINTER: the concrete next step to take (free text, e.g.
                                #   "dispatch EXP-0007 to devgpu014 with host_mem_floor 300" or
                                #   "convene committee with packet for CLAIM-0006")
blocking_on: ""                 # if lifecycle_state=blocked: what/who it waits on
active_experiments: []          # EXP-ids currently running for this claim (resume watches these)
claim: ""                       # one-sentence falsifiable claim
why_it_matters: ""              # the pain point / impact
novelty_hypothesis: ""          # what is claimed new (mechanism, not naming)
mandatory_baselines: []         # baselines this MUST beat/compare (from baseline matrix)
academic_map_nodes: []          # which map node(s) this occupies
supporting_evidence: []         # [{exp_id, summary, data_path}]
negative_evidence: []           # [{exp_id, summary, data_path}]  <- kept, never hidden
verdict_history: []             # [{verdict_id, date, result}]
revival_conditions: ""          # if killed/archived: exactly what evidence would revive it
owner: ""                       # session/agent/human that owns it
prompt_version: ""              # role-prompt version that created/last-edited
created_at: ""
last_updated: ""
